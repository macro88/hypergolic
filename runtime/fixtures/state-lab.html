  <style>:root{--bg: #140f0b;--text: #f3efeb;--primary: #e8805d;color-scheme:dark;font:16px/1.5 system-ui,sans-serif}*{box-sizing:border-box}html,body,#lab{background:var(--bg);color:var(--text)}body{margin:0}#lab{max-width:44rem;margin-inline:auto;padding:clamp(16px,5vw,32px)}h1{font-size:clamp(32px,8vw,48px);line-height:1.1;margin:8px 0 12px;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}.eyebrow,legend{font-size:12px;font-weight:700;letter-spacing:.08em}.eyebrow{color:var(--primary)}.meta,footer{color:color-mix(in srgb,var(--text) 68%,var(--bg));font-size:13px}#identity{display:block;font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;padding:12px 0}fieldset{min-width:0;border:1px solid color-mix(in srgb,var(--text) 20%,var(--bg));border-radius:16px;padding:16px;margin:20px 0}legend{padding:0 8px}label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}input,textarea,select{display:block;width:100%;min-width:0;margin:0 0 16px;border:1px solid color-mix(in srgb,var(--text) 30%,var(--bg));border-radius:8px;padding:10px;background:color-mix(in srgb,var(--text) 4%,var(--bg));color:var(--text);font:inherit}textarea{resize:vertical}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{min-height:44px;border:1px solid color-mix(in srgb,var(--text) 30%,var(--bg));border-radius:9px;color:var(--text);background:color-mix(in srgb,var(--text) 7%,var(--bg));font:600 14px system-ui,sans-serif;cursor:pointer}#write{background:var(--primary);color:var(--bg);border-color:var(--primary)}:focus-visible{outline:3px solid var(--primary);outline-offset:3px}fieldset:disabled{opacity:.6}button:disabled{cursor:wait}#result{display:block;white-space:pre-wrap;overflow-wrap:anywhere;max-height:12rem;overflow-y:auto;font-family:ui-monospace,monospace;font-size:14px}#key-list{padding-left:20px;overflow-wrap:anywhere}footer{border-top:1px solid color-mix(in srgb,var(--text) 20%,var(--bg));margin-top:24px;pad <body>
<main id="lab" data-testid="lab" data-ready="false">
  <header>
    <p class="eyebrow">HYPERGOLIC / TEST 02</p>
    <h1 id="title">State Lab</h1>
    <p>Save a trace. Reload. Find it again.</p>
    <p id="identity-status" data-testid="identity-status" role="status">Connecting…</p>
    <output id="identity" data-testid="identity"></output>
  </header>
  <fieldset id="controls" disabled>
    <legend>Saved strings</legend>
    <label for="scope">Save in</label>
    <select id="scope" data-testid="scope"><option value="shared">All instances of this napplet</option><option value="instance">This instance only</option></select>
    <label for="key">Key</label>
    <input id="key" data-testid="key" value="sample" maxlength="256" autocomplete="off" spellcheck="false" />
    <label for="value">String value</label>
    <textarea id="value" data-testid="value" rows="3" maxlength="262145" autocomplete="off" spellcheck="false" placeholder="Something you will recognise…"></textarea>
    <div class="actions">
      <button id="write" data-testid="write" type="button">Write</button>
      <button id="read" data-testid="read" type="button">Read</button>
      <button id="remove" data-testid="remove" type="button">Remove</button>
      <button id="keys" data-testid="keys" type="button">List keys</button>
    </div>
  </fieldset>
  <section aria-labelledby="result-title">
    <h2 id="result-title">Result</h2>
    <p id="status" data-testid="status" role="status">No request yet.</p>
    <output id="result" data-testid="result" data-state="idle"></output>
    <ul id="key-list" data-testid="key-list" aria-label="Saved keys"></ul>
    <p class="meta">Requests <output id="requests" data-testid="requests">0</output></p>
  </section>
  <footer><p>Storage is separated by identity and napplet. Nothing here is published.</p><p class="meta" id="theme-status" data-testid="theme-status">Local palette</p></footer>
</main>
</body>
</html>
