plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.nostrocket.hypergolic.host'
version = '0.0.0'
expoModule { canBePublished false }
android {
  namespace 'org.nostrocket.hypergolic.host'
  defaultConfig { versionCode 1; versionName '0.0.0' }
}
dependencies { implementation 'androidx.webkit:webkit:1.17.0' }

// Packaged trusted-host assets must come from the separately locked web build.
tasks.named('preBuild').configure {
  doFirst {
    for (name in ['index.html', 'host.js']) {
      if (!file("src/main/assets/runtime/$name").isFile()) {
        throw new GradleException("Missing trusted runtime asset $name. Run pnpm run runtime:build first.")
      }
    }
  }
}
